# Benchmark harness for the Paho MQTT client.
#
# Not a workspace member: it is built once per backend, and enabling both
# `tokio` and `smol` is a compile error. See ../README.md.

[package]
name = "mqttbench"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["tokio"]
tokio = ["paho-mqtt/tokio", "dep:tokio"]
smol = ["paho-mqtt/smol", "dep:smol"]

[dependencies]
paho-mqtt = { path = "../..", default-features = false }
paho-mqtt-codec = { path = "../../paho-mqtt-codec" }
bytes = "1"
libc = "0.2"
tokio = { version = "1.49", features = ["rt-multi-thread"], optional = true }
smol = { version = "2.0", optional = true }

[profile.release]
debug = true
