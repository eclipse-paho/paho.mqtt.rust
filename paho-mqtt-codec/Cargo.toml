[package]
name = "paho-mqtt-codec"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["Frank Pagliughi <fpagliughi@mindspring.com>"]
homepage = "https://github.com/eclipse/paho.mqtt.rust"
repository = "https://github.com/eclipse/paho.mqtt.rust"
keywords = ["MQTT", "IoT", "Paho", "messaging", "codec"]
categories = [ "network-programming", "encoding", "no-std" ]
license = "EPL-2.0"
description = """
Pure Rust, no_std MQTT v3.1, v3.1.1, and v5 packet encoder/decoder for clients, brokers, and tools.
This is part of the official Eclipse Paho Rust Client Library, for v2.x and later.
"""

[features]
default = ["std"]
std = ["bytes/std", "thiserror/std"]
serde = ["dep:serde", "bytes/serde"]

[dependencies]
bytes = { version = "1", default-features = false }
thiserror = { version = "2.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }
strum = { version = "0.28.0", default-features = false }
strum_macros = "0.28.0"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[[bench]]
name = "codec"
harness = false
