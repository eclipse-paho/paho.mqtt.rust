[workspace]
members = ["paho-mqtt-codec"]
resolver = "2"

[package]
name = "paho-mqtt"
version = "2.0.0-pre.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["Frank Pagliughi <fpagliughi@mindspring.com>"]
homepage = "https://github.com/eclipse/paho.mqtt.rust"
repository = "https://github.com/eclipse/paho.mqtt.rust"
keywords = [ "MQTT", "IoT", "Paho", "messaging" ]
license = "EPL-2.0"
description = """
The Eclipse Paho MQTT Rust client library.
"""

[features]
default = ["tokio"]
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile", "dep:rustls-native-certs", "tokio"]
websocket = ["dep:tokio-tungstenite", "tokio"]
serde = ["dep:serde"]

[dependencies]
paho-mqtt-codec = { path = "paho-mqtt-codec" }
bytes = "1"
futures = "0.3"
futures-timer = "3.0"
async-channel = "2.5"
crossbeam-channel = "0.5"
log = "0.4"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
tokio-tungstenite = { version = "0.24", optional = true }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-native-certs = { version = "0.7", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
env_logger = "0.11"
tempfile = "3"
toml = "0.9"
serde = "1.0"
serde_json = "1.0"
lazy_static = "1.4"
futures-util = "0.3"
ctrlc = "3.2"
smol = "2.0"

[[example]]
name = "tokio_event_subscribe_v5"
required-features = ["tokio"]

[[example]]
name = "tokio_publish"
required-features = ["tokio"]
