[workspace]
members = ["paho-mqtt-codec"]
exclude = ["paho-mqtt-codec/fuzz"]
resolver = "2"

[package]
name = "paho-mqtt"
version = "2.0.0-pre.1"
edition = "2024"
rust-version = "1.89.0"
authors = ["Frank Pagliughi <fpagliughi@mindspring.com>"]
homepage = "https://github.com/eclipse/paho.mqtt.rust"
repository = "https://github.com/eclipse/paho.mqtt.rust"
keywords = [ "MQTT", "IoT", "Paho", "messaging" ]
categories = [ "network-programming", "asynchronous" ]
license = "EPL-2.0"
description = """
The Eclipse Paho MQTT Rust client library. 
A pure-Rust MQTT v5, v3.1.1, and v3.1 client.
"""

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
smol = ["dep:smol"]
smol-tls = ["smol", "dep:futures-rustls", "dep:rustls", "dep:rustls-pemfile", "dep:rustls-native-certs"]
smol-websocket = ["smol", "dep:async-tungstenite"]
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile", "dep:rustls-native-certs", "tokio"]
openssl = ["dep:openssl", "dep:tokio-openssl", "tokio"]
openssl-vendored = ["openssl", "openssl/vendored"]
websocket = ["dep:tokio-tungstenite", "tokio"]
serde = ["dep:serde", "paho-mqtt-codec/serde", "bytes/serde"]

[dependencies]
paho-mqtt-codec = { version = "0.1", path = "paho-mqtt-codec" }
bytes = "1"
futures = "0.3"
futures-timer = "3.0"
async-channel = "2.5"
crossbeam-channel = "0.5"
log = "0.4"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"], optional = true }
smol = { version = "2.0", optional = true }
tokio-rustls = { version = "0.26", optional = true }
futures-rustls = { version = "0.26", optional = true }
async-tungstenite = { version = "0.27", optional = true }
tokio-tungstenite = { version = "0.24", optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-native-certs = { version = "0.7", optional = true }
openssl = { version = "0.10", optional = true }
tokio-openssl = { version = "0.6", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
env_logger = "0.11"
tempfile = "3"
rcgen = "0.14"
rustls = { version = "0.23", features = ["ring"] }
tungstenite = "0.24"
toml = "0.9"
serde = "1.0"
serde_json = "1.0"
futures-util = "0.3"
ctrlc = "3.2"
smol = "2.0"

[[example]]
name = "tokio_event_subscribe_v5"
required-features = ["tokio"]

[[example]]
name = "tokio_publish"
required-features = ["tokio"]

[[example]]
name = "tokio_math_srvr"
required-features = ["tokio"]

[[example]]
name = "tokio_math_cli"
required-features = ["tokio"]

[[example]]
name = "smol_publish"
required-features = ["smol"]

[[example]]
name = "smol_event_subscribe_v5"
required-features = ["smol"]

[[example]]
name = "smol_math_srvr"
required-features = ["smol"]

[[example]]
name = "smol_math_cli"
required-features = ["smol"]
